name: WaniKani review notifier

# Runs on a dumb fixed schedule; notify.js decides whether this particular run
# should actually notify (DND window, quiet days, thresholds, cooldown). Cron
# here is UTC-only and can't express "10pm your time" across DST, so the real
# scheduling logic deliberately lives in the script instead.
#
# The schedule is deliberately gone. GitHub ran it roughly six times in the
# twelve hours it was live rather than the requested forty-eight, which made
# "tell me when a batch lands" mean "sometime in the next couple of hours".
# The live notifier is now /api/notify on Vercel, driven by an external pinger
# (see notify/README.md).
#
# This workflow stays as a manual escape hatch — useful for forcing a test
# notification, or as a fallback if the pinger ever goes away. Note that it
# keeps its own state separate from the endpoint's, so a manual run here can
# repeat a notification the endpoint already sent.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and log, but don't send"
        type: boolean
        default: false
      force:
        description: "Ignore DND/cooldown/thresholds and send now (test)"
        type: boolean
        default: false

concurrency:
  group: wk-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Cooldown state has to survive between runs. Cache keys are immutable,
      # so each run writes a new uniquely-keyed entry and restores the most
      # recent one by prefix. If it's ever evicted the script treats it as
      # "no history" and the worst case is one extra notification.
      - name: Restore notifier state
        uses: actions/cache/restore@v4
        with:
          path: .notify-state
          key: notify-state-${{ github.run_id }}
          restore-keys: notify-state-

      - name: Check WaniKani and notify
        id: check
        env:
          WANIKANI_API_KEY: ${{ secrets.WANIKANI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p .notify-state
          node notify/notify.js \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      # Only re-upload when a notification actually fired — most runs decide to
      # stay quiet and would otherwise churn out an identical cache entry every
      # 15 minutes.
      - name: Save notifier state
        if: steps.check.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .notify-state
          key: notify-state-${{ github.run_id }}
